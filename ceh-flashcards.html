<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>CEH Flashcards</title>
<link rel="stylesheet" href="styles.css"/>
<style>body{margin:0;background:#0b1220;color:#fff;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column}.top{padding:1rem;display:flex;justify-content:space-between;border-bottom:1px solid #243044}.top a{color:#a3e635;text-decoration:none}.stage{flex:1;display:flex;align-items:center;justify-content:center}.card{width:min(500px,92vw);min-height:220px;background:#141b2b;border:1px solid #243044;border-radius:16px;padding:1.75rem;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center}.controls{display:flex;gap:.7rem;justify-content:center;padding:1rem}button{padding:.7rem 1.2rem;border-radius:8px;border:1px solid #243044;background:#121927;color:#fff;cursor:pointer}</style></head>
<body><div class="top"><a href="ceh.html">&larr; Hub</a><span id="c"></span></div>
<div class="stage"><div class="card" id="card" onclick="flip()"></div></div>
<div class="controls"><button onclick="prev()">Prev</button><button onclick="next()">Next</button></div>
<script>
const C=[{t:"Reconnaissance",d:"Gathering information about a target before active testing."},{t:"Nmap",d:"Network scanner for hosts, ports, and services."},{t:"Rules of engagement",d:"Written scope, timing, and allowed techniques for an authorized test."},{t:"White hat",d:"Authorized tester working to improve security."},{t:"SQL injection",d:"Attack that abuses unsanitized input reaching a database."},{t:"Metasploit",d:"Exploitation framework used in authorized assessments."},{t:"OSINT",d:"Open-source intelligence from public information."}];
let i=0,f=false;function show(){f=false;document.getElementById('card').textContent=C[i].t;document.getElementById('c').textContent=(i+1)+' / '+C.length;}
function flip(){f=!f;document.getElementById('card').textContent=f?C[i].d:C[i].t;}
function next(){i=(i+1)%C.length;show();}function prev(){i=(i-1+C.length)%C.length;show();}show();
</script><script src="site.js"></script>
</body></html>
