<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLERE Practice Exam | Jesse's Study Guides</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .exam-wrap { max-width: 800px; margin: 0 auto; padding: 1.5rem; }
    .q-card { background: var(--bg-card); border: 1px solid var(--border-slate); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; }
    .q-num { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #e8a87c; margin-bottom: 0.5rem; }
    .q-text { font-size: 1.05rem; line-height: 1.5; margin-bottom: 1rem; color: #fff; }
    .opt { display: block; width: 100%; text-align: left; background: #121927; border: 1.5px solid var(--border-slate); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.5rem; color: #fff; cursor: pointer; font-size: 0.95rem; }
    .opt:hover { border-color: #e8a87c; }
    .opt.correct { border-color: #9eff33; background: rgba(158,255,51,0.1); }
    .opt.wrong { border-color: #fb7185; background: rgba(251,113,133,0.1); }
    .explain { margin-top: 0.75rem; padding: 0.75rem; background: rgba(13,18,28,0.8); border-radius: 8px; font-size: 0.88rem; color: var(--text-secondary); display: none; }
    .explain.show { display: block; }
    .score-bar { position: sticky; top: 0; background: #0b1220; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-slate); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
    .btn-back { color: #e8a87c; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="score-bar">
    <a href="olere.html" class="btn-back">&larr; OLERE Hub</a>
    <span id="score">Score: 0 / 0</span>
  </div>
  <div class="exam-wrap" id="exam"></div>
  <script>
const QUESTIONS = [
  { q: "In Oklahoma, how many hours of supervised experience are typically required for LPC licensure?", opts: ["1,000 hours", "2,000 hours", "3,000 hours", "4,000 hours"], correct: 2, exp: "Oklahoma requires 3,000 hours of supervised postgraduate experience for LPC licensure." },
  { q: "Which board regulates Licensed Professional Counselors in Oklahoma?", opts: ["Oklahoma Medical Board", "State Board of Behavioral Health Licensure", "Oklahoma Psychology Board", "Department of Human Services"], correct: 1, exp: "The Oklahoma State Board of Behavioral Health Licensure oversees LPC licensure." },
  { q: "Oklahoma mandated reporters must report suspected child abuse to:", opts: ["Only the school principal", "DHS Child Welfare or law enforcement", "The client's parents first", "The licensing board only"], correct: 1, exp: "Mandated reporters contact the Oklahoma Department of Human Services or law enforcement." },
  { q: "An LPC in Oklahoma may practice independently after:", opts: ["Graduation from a master's program", "Passing the NCE only", "Completing supervision and obtaining full licensure", "One year of any counseling work"], correct: 2, exp: "Independent practice requires completion of required supervision and full LPC licensure." },
  { q: "Continuing education for Oklahoma LPCs is required:", opts: ["Every year with no exceptions", "Biennially, with specific hour requirements", "Only when changing employers", "Never after initial licensure"], correct: 1, exp: "Oklahoma requires ongoing CE for license renewal on a set cycle." },
  { q: "A dual relationship in a small Oklahoma town is:", opts: ["Always prohibited with no exceptions", "Sometimes unavoidable; must be managed carefully", "Encouraged to build community trust", "Only a problem in urban areas"], correct: 1, exp: "Rural practice may involve unavoidable multiple relationships that require careful boundary management." },
  { q: "Client records in Oklahoma must generally be retained for:", opts: ["1 year", "3 years", "7 years or as required by rule", "Indefinitely"], correct: 2, exp: "Record retention follows board rules, typically several years after last contact." },
  { q: "An LPC candidate (under supervision) in Oklahoma:", opts: ["May practice without any oversight", "Must practice under an approved supervisor", "Can bill insurance independently", "Needs no documentation of hours"], correct: 1, exp: "Candidates accrue hours under board-approved supervision." },
  { q: "Informed consent in Oklahoma counseling should include:", opts: ["Only the fee amount", "Limits of confidentiality, fees, and therapist credentials", "A guarantee of specific outcomes", "The client's social media handles"], correct: 1, exp: "Informed consent covers confidentiality limits, costs, qualifications, and treatment nature." },
  { q: "Sexual contact with a current client in Oklahoma is:", opts: ["Permitted if the client initiates", "Always unethical and prohibited", "Allowed after 6 months", "Acceptable in rural areas"], correct: 1, exp: "Sexual relationships with current clients are strictly prohibited." },
  { q: "Privilege (confidentiality in legal proceedings) for counseling in Oklahoma:", opts: ["Does not exist", "May be limited by court order or mandated reporting", "Is absolute with no exceptions", "Only applies to psychiatrists"], correct: 1, exp: "Privilege has exceptions including court orders and safety-related mandates." },
  { q: "An Oklahoma LPC who moves to another state:", opts: ["Automatically has a license there", "Must meet that state's requirements", "Can practice anywhere with an OK license", "Loses the OK license immediately"], correct: 1, exp: "Licensure is state-specific; other states have their own requirements." },
  { q: "Supervision hours in Oklahoma must be:", opts: ["Documented and verifiable", "Estimated by the candidate", "Only verbal with no records", "Completed entirely online with no rules"], correct: 0, exp: "Supervision must be properly documented per board requirements." },
  { q: "Bartering for services with a client in Oklahoma:", opts: ["Is always acceptable", "Requires careful consideration of exploitation risk", "Is required in rural areas", "Is prohibited by federal law only"], correct: 1, exp: "Bartering can create conflicts; ethics codes urge caution." },
  { q: "A client requests their records. In Oklahoma, the LPC should:", opts: ["Always refuse", "Provide access consistent with law and ethics, with limited exceptions", "Charge any amount desired", "Destroy the records first"], correct: 1, exp: "Clients generally have a right to access records, with narrow exceptions." },
  { q: "Telehealth counseling for Oklahoma clients:", opts: ["Has no regulations", "Must comply with Oklahoma licensure and applicable rules", "Is only allowed for psychiatrists", "Requires no informed consent"], correct: 1, exp: "Telehealth is regulated; the counselor must be appropriately licensed for the client's location." },
  { q: "Reporting colleague impairment in Oklahoma is:", opts: ["Never appropriate", "An ethical responsibility when client welfare is at risk", "Only the board's job", "Optional gossip"], correct: 1, exp: "Ethical codes support addressing impairment that risks clients." },
  { q: "The NCE is:", opts: ["An Oklahoma-only exam", "A national exam often required alongside state requirements", "Replaced by OLERE entirely", "Only for social workers"], correct: 1, exp: "Many states including Oklahoma use the NCE plus state-specific requirements." },
  { q: "Advertising counseling services in Oklahoma must:", opts: ["Guarantee cures", "Be truthful and not misleading", "Include client testimonials always", "Hide the counselor's credentials"], correct: 1, exp: "Advertising must be accurate and not deceptive." },
  { q: "A minor client in Oklahoma:", opts: ["Always has full confidentiality from parents", "Has confidentiality with exceptions related to safety and parental rights", "Cannot receive counseling", "Must have a court order for any session"], correct: 1, exp: "Minor confidentiality is limited; parents often have rights, balanced with minor welfare." },
  { q: "Abandonment of a client occurs when an LPC:", opts: ["Takes a planned vacation with coverage", "Terminates suddenly without referral when still needed", "Refers appropriately", "Ends treatment by mutual agreement"], correct: 1, exp: "Abrupt termination without arrangement for continued care can constitute abandonment." },
  { q: "Fees and billing in Oklahoma should be:", opts: ["Hidden until the end", "Disclosed in advance as part of informed consent", "Changed without notice", "Based solely on client income with no discussion"], correct: 1, exp: "Financial arrangements belong in informed consent." },
  { q: "An LPC may release information without consent when:", opts: ["A friend asks nicely", "Mandated reporting or a valid court order applies", "The client is late to a session", "Never under any circumstances"], correct: 1, exp: "Exceptions include legal mandates and certain safety situations." },
  { q: "Scope of practice for an Oklahoma LPC includes:", opts: ["Prescribing medication", "Counseling within education and competence", "Performing surgery", "Legal representation"], correct: 1, exp: "Practice must stay within training, competence, and legal authorization." },
  { q: "Documentation of sessions should be:", opts: ["Optional", "Timely, accurate, and sufficient for continuity", "Shared on social media", "Destroyed daily"], correct: 1, exp: "Records support care continuity and meet professional standards." },
  { q: "A conflict of interest arises when:", opts: ["The counselor has lunch alone", "Personal interests could impair professional judgment", "The client pays the agreed fee", "Sessions occur in an office"], correct: 1, exp: "Conflicts exist when personal gain or relationships may bias care." },
  { q: "Group counseling confidentiality in Oklahoma:", opts: ["Can be absolutely guaranteed by the leader", "Cannot be fully guaranteed because members are not bound like the counselor", "Is irrelevant", "Only applies to the leader"], correct: 1, exp: "Leaders must explain that member-to-member confidentiality cannot be enforced the same way." },
  { q: "License renewal in Oklahoma typically requires:", opts: ["Nothing after initial issue", "CE hours and fees by the deadline", "Retaking the NCE every year", "A new degree"], correct: 1, exp: "Renewal involves continuing education and administrative requirements." },
  { q: "If a client threatens serious harm to an identifiable person, the Oklahoma counselor:", opts: ["Must always stay silent", "May have a duty to warn or protect consistent with law", "Should post about it online", "Only tells the client's family"], correct: 1, exp: "Duty-to-protect principles may require action when imminent harm is foreseeable." },
  { q: "Internship or practicum hours for Oklahoma licensure:", opts: ["Count fully without supervision rules", "Must meet board-specified supervision standards", "Are optional", "Can be fabricated"], correct: 1, exp: "Training hours must satisfy board supervision and documentation rules." },
  { q: "Cultural competence in Oklahoma practice means:", opts: ["Ignoring cultural differences", "Providing services responsive to client cultural context", "Only seeing clients from one background", "Memorizing one textbook"], correct: 1, exp: "Effective practice includes cultural responsiveness." },
  { q: "Termination of counseling should include:", opts: ["No discussion", "Planning, review of progress, and referrals if needed", "Immediate ghosting", "A social media announcement"], correct: 1, exp: "Ethical termination is collaborative and provides for continuity when appropriate." },
  { q: "An Oklahoma LPC using assessments must:", opts: ["Use any test found online", "Be qualified and use instruments appropriately", "Skip informed consent", "Share raw data publicly"], correct: 1, exp: "Assessment use requires competence and proper administration." },
  { q: "Gifts from clients:", opts: ["Must always be accepted", "Should be evaluated for impact on the relationship", "Are required", "Are illegal"], correct: 1, exp: "Gifts can affect boundaries and should be handled thoughtfully." },
  { q: "Supervision notes for candidates should:", opts: ["Be discarded immediately", "Document hours, content, and evaluation as required", "Be posted publicly", "Only exist verbally"], correct: 1, exp: "Proper supervision documentation protects the candidate and the public." },
  { q: "A complaint to the Oklahoma board may result in:", opts: ["Nothing ever", "Investigation and possible sanctions", "Automatic prison", "A cash prize"], correct: 1, exp: "Boards investigate complaints and may impose discipline." },
  { q: "Confidentiality after client death in Oklahoma:", opts: ["Ends completely", "Generally continues, with legal exceptions", "Requires a blog post", "Is optional"], correct: 1, exp: "Confidentiality obligations typically survive death unless law provides otherwise." },
  { q: "Multiple clients from the same family:", opts: ["Never create issues", "Require clear policies about secrets and roles", "Are always ideal", "Are prohibited by federal tax law"], correct: 1, exp: "Treating related clients needs clear agreements about information sharing." },
  { q: "Emergency coverage when an LPC is unavailable:", opts: ["Is unnecessary", "Should be arranged so clients are not abandoned", "Means deleting the practice", "Is only for hospitals"], correct: 1, exp: "Reasonable coverage planning supports continuity of care." },
  { q: "Research with clients in Oklahoma requires:", opts: ["No consent", "Informed consent and ethical review as applicable", "Secret recording", "Payment to the board"], correct: 1, exp: "Research participation requires proper consent and protections." },
  { q: "The primary purpose of Oklahoma counseling regulation is:", opts: ["Maximizing counselor income", "Protecting the public", "Eliminating all rural practice", "Replacing national ethics codes"], correct: 1, exp: "Licensure exists primarily to protect public welfare." }
];
let answered = 0, correctCount = 0;
const exam = document.getElementById('exam');
QUESTIONS.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = '<div class="q-num">Question ' + (i+1) + ' of ' + QUESTIONS.length + '</div><div class="q-text">' + item.q + '</div>';
  item.opts.forEach((opt, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => {
      if (card.dataset.done) return;
      card.dataset.done = '1';
      answered++;
      btn.classList.add(oi === item.correct ? 'correct' : 'wrong');
      if (oi === item.correct) correctCount++;
      else card.querySelectorAll('.opt')[item.correct].classList.add('correct');
      card.querySelector('.explain').classList.add('show');
      document.getElementById('score').textContent = 'Score: ' + correctCount + ' / ' + answered;
    };
    card.appendChild(btn);
  });
  const exp = document.createElement('div');
  exp.className = 'explain';
  exp.textContent = item.exp;
  card.appendChild(exp);
  exam.appendChild(card);
});
  </script>
</body>
</html>
