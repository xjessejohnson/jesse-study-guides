<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OLERE Practice Exam | Jesse's Study Guides</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    .exam-topbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.85rem; margin-bottom:1.25rem; }
    .btn-ghost { padding:0.55rem 1rem; border-radius:8px; border:1px solid var(--border-slate); background:transparent; color:var(--text-secondary); font-family:'JetBrains Mono',monospace; font-size:0.76rem; cursor:pointer; text-decoration:none; }
    .btn-lime { padding:0.78rem 1.45rem; border-radius:9px; border:none; background:var(--lime); color:#05070c; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.82rem; text-transform:uppercase; cursor:pointer; }
    .progress-track { width:100%; height:5px; background:rgba(148,163,184,0.14); border-radius:999px; overflow:hidden; margin-bottom:1.4rem; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--lime)); transition:width 0.25s ease; }
    .q-card { background:var(--bg-card); border:1px solid var(--border-slate); border-radius:12px; padding:1.35rem; }
    .q-text { font-size:1.08rem; line-height:1.5; margin-bottom:1rem; color:#fff; }
    .opt { display:block; width:100%; text-align:left; background:#121927; border:1.5px solid var(--border-slate); border-radius:10px; padding:0.8rem 1rem; margin-bottom:0.5rem; color:#fff; cursor:pointer; font-size:0.95rem; }
    .opt:hover { border-color:var(--cyan); }
    .opt.selected { border-color:var(--lime); background:rgba(158,255,51,0.1); }
    .opt.correct { border-color:var(--lime); }
    .opt.wrong { border-color:var(--rose); }
    .jump-wrap { margin-top:1.25rem; }
    .jump-label { font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--text-secondary); margin-bottom:0.5rem; }
    .jump-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:0.35rem; }
    .jump-opt { padding:0.4rem; border-radius:6px; border:1px solid transparent; background:rgba(255,255,255,0.04); color:var(--text-secondary); font-family:'JetBrains Mono',monospace; font-size:0.72rem; text-align:center; cursor:pointer; }
    .jump-opt.answered { background:rgba(34,211,238,0.22); color:var(--cyan); }
    .jump-opt.current { background:var(--lime); color:#05070c; font-weight:700; }
    .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:1rem; }
    .mode-choice { background:#121927; border:1.5px solid var(--border-slate); border-radius:12px; padding:1.1rem; text-align:left; cursor:pointer; color:#fff; }
    .mode-choice:hover { border-color:var(--lime); }
    .mode-choice-title { font-weight:700; margin-bottom:0.3rem; }
    .mode-choice-desc { font-size:0.85rem; color:var(--text-secondary); }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:none; align-items:center; justify-content:center; z-index:50; padding:1rem; }
    .modal-backdrop.open { display:flex; }
    .modal-box { background:#141b2b; border:1px solid var(--border-slate); border-radius:14px; padding:1.35rem; max-width:560px; width:100%; }
    .nav-row { display:flex; gap:0.6rem; margin-top:1rem; }
    @media (max-width:640px) { .mode-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="frame-wrapper">
    <div class="main-area" style="margin-left:0;">
      <div class="topbar">
        <div class="breadcrumb"><a href="olere.html" style="color:inherit;text-decoration:none;">← Hub</a> / <span>EXAM</span></div>
        <div class="status-pill"><span class="status-dot"></span> <span id="mode-label">Select mode</span></div>
      </div>
      <main class="content-body" id="exam-main"></main>
    </div>
  </div>
  <div class="modal-backdrop open" id="mode-modal">
    <div class="modal-box">
      <div style="font-family:'Archivo Black',sans-serif;font-size:1.2rem;margin-bottom:0.4rem;">Select Exam Mode</div>
      <p style="color:var(--text-secondary);font-size:0.92rem;">Oklahoma Legal and Ethical Responsibilities Examination practice.</p>
      <div class="mode-grid">
        <button type="button" class="mode-choice" onclick="startMode('instant')">
          <div class="mode-choice-title">Answers Instantly</div>
          <div class="mode-choice-desc">Immediate feedback with explanation. Jump between questions anytime.</div>
        </button>
        <button type="button" class="mode-choice" onclick="startMode('end')">
          <div class="mode-choice-title">Answers at the End</div>
          <div class="mode-choice-desc">Answer the full set, then review score and explanations.</div>
        </button>
      </div>
    </div>
  </div>
  <div class="modal-backdrop" id="feedback-modal">
    <div class="modal-box">
      <div id="fb-title" style="font-weight:700;margin-bottom:0.5rem;"></div>
      <div id="fb-body" style="color:var(--text-secondary);font-size:0.92rem;line-height:1.5;"></div>
      <button class="btn-lime" style="margin-top:1rem;" onclick="closeFb()">Continue</button>
    </div>
  </div>
  <script>

const QUESTIONS = [
  { q: "In Oklahoma, how many hours of supervised experience are typically required for LPC licensure?", opts: ["1,000 hours","2,000 hours","3,000 hours","4,000 hours"], correct: 2, exp: "Oklahoma requires 3,000 hours of supervised postgraduate experience for LPC licensure." },
  { q: "Which board regulates Licensed Professional Counselors in Oklahoma?", opts: ["Oklahoma Medical Board","State Board of Behavioral Health Licensure","Oklahoma Psychology Board","Department of Human Services"], correct: 1, exp: "The Oklahoma State Board of Behavioral Health Licensure oversees LPC licensure." },
  { q: "Oklahoma mandated reporters must report suspected child abuse to:", opts: ["Only the school principal","DHS Child Welfare or law enforcement","The client's parents first","The licensing board only"], correct: 1, exp: "Mandated reporters contact DHS or law enforcement." },
  { q: "An LPC in Oklahoma may practice independently after:", opts: ["Graduation only","Passing the NCE only","Completing supervision and obtaining full licensure","One year of any work"], correct: 2, exp: "Independent practice requires completed supervision and full licensure." },
  { q: "Sexual contact with a current client in Oklahoma is:", opts: ["Permitted if the client initiates","Always prohibited","Allowed after 6 months","Acceptable in rural areas"], correct: 1, exp: "Sexual relationships with current clients are strictly prohibited." },
  { q: "Informed consent in Oklahoma counseling should include:", opts: ["Only the fee","Limits of confidentiality, fees, and credentials","A guarantee of outcomes","Social media handles"], correct: 1, exp: "Informed consent covers confidentiality limits, costs, and qualifications." },
  { q: "A dual relationship in a small Oklahoma town is:", opts: ["Always prohibited with no nuance","Sometimes unavoidable and must be managed","Encouraged","Only a problem in cities"], correct: 1, exp: "Rural practice may involve unavoidable multiple relationships requiring careful management." },
  { q: "Telehealth counseling for Oklahoma clients:", opts: ["Has no rules","Must comply with Oklahoma licensure for the client's location","Is only for psychiatrists","Needs no consent"], correct: 1, exp: "The counselor must be appropriately licensed for where the client is located." },
  { q: "If a client threatens serious harm to an identifiable person, the counselor:", opts: ["Must always stay silent","May have a duty to protect consistent with law","Should post online","Only tells family"], correct: 1, exp: "Duty-to-protect principles may require action when imminent harm is foreseeable." },
  { q: "The primary purpose of Oklahoma counseling regulation is:", opts: ["Maximizing income","Protecting the public","Eliminating rural practice","Replacing national ethics"], correct: 1, exp: "Licensure exists primarily to protect public welfare." },
  { q: "Client records in Oklahoma must generally be:", opts: ["Destroyed daily","Retained per board rule","Posted publicly","Optional"], correct: 1, exp: "Record retention follows board rules after last contact." },
  { q: "An LPC candidate under supervision in Oklahoma:", opts: ["May practice with no oversight","Must practice under an approved supervisor","Can bill independently with no rules","Needs no hour logs"], correct: 1, exp: "Candidates accrue hours under board-approved supervision." },
  { q: "Advertising counseling services in Oklahoma must:", opts: ["Guarantee cures","Be truthful and not misleading","Always include testimonials","Hide credentials"], correct: 1, exp: "Advertising must be accurate." },
  { q: "A minor client in Oklahoma:", opts: ["Always has full confidentiality from parents","Has confidentiality with safety and parental-rights exceptions","Cannot receive counseling","Needs a court order for any session"], correct: 1, exp: "Minor confidentiality is limited and balanced with parental rights and safety." },
  { q: "Abandonment occurs when an LPC:", opts: ["Takes planned leave with coverage","Terminates suddenly without referral when still needed","Refers appropriately","Ends by mutual agreement"], correct: 1, exp: "Abrupt termination without continuity arrangements can be abandonment." },
  { q: "Privilege for counseling communications in Oklahoma:", opts: ["Does not exist","May be limited by court order or mandated reporting","Is absolute","Only applies to psychiatrists"], correct: 1, exp: "Privilege has exceptions including court orders and safety mandates." },
  { q: "Continuing education for Oklahoma LPCs is:", opts: ["Never required","Required on the renewal cycle","Only when changing jobs","Optional after year one"], correct: 1, exp: "Oklahoma requires ongoing CE for renewal." },
  { q: "Bartering for services:", opts: ["Is always fine","Requires careful consideration of exploitation risk","Is required in rural areas","Is banned by federal tax law only"], correct: 1, exp: "Bartering can create conflicts and should be handled with caution." },
  { q: "A client requests their records. The LPC should:", opts: ["Always refuse","Provide access consistent with law, with limited exceptions","Charge any amount","Destroy them first"], correct: 1, exp: "Clients generally have a right of access, with narrow exceptions." },
  { q: "Scope of practice for an Oklahoma LPC includes:", opts: ["Prescribing medication","Counseling within education and competence","Surgery","Legal representation"], correct: 1, exp: "Practice must stay within training, competence, and legal authorization." },
  { q: "In Oklahoma, how many hours of supervised experience are typically required for LPC licensure?", opts: ["1,000 hours","2,000 hours","3,000 hours","4,000 hours"], correct: 2, exp: "Oklahoma requires 3,000 hours of supervised postgraduate experience for LPC licensure." },
  { q: "Which board regulates Licensed Professional Counselors in Oklahoma?", opts: ["Oklahoma Medical Board","State Board of Behavioral Health Licensure","Oklahoma Psychology Board","Department of Human Services"], correct: 1, exp: "The Oklahoma State Board of Behavioral Health Licensure oversees LPC licensure." },
  { q: "Oklahoma mandated reporters must report suspected child abuse to:", opts: ["Only the school principal","DHS Child Welfare or law enforcement","The client's parents first","The licensing board only"], correct: 1, exp: "Mandated reporters contact DHS or law enforcement." },
  { q: "An LPC in Oklahoma may practice independently after:", opts: ["Graduation only","Passing the NCE only","Completing supervision and obtaining full licensure","One year of any work"], correct: 2, exp: "Independent practice requires completed supervision and full licensure." },
  { q: "Sexual contact with a current client in Oklahoma is:", opts: ["Permitted if the client initiates","Always prohibited","Allowed after 6 months","Acceptable in rural areas"], correct: 1, exp: "Sexual relationships with current clients are strictly prohibited." },
  { q: "Informed consent in Oklahoma counseling should include:", opts: ["Only the fee","Limits of confidentiality, fees, and credentials","A guarantee of outcomes","Social media handles"], correct: 1, exp: "Informed consent covers confidentiality limits, costs, and qualifications." },
  { q: "A dual relationship in a small Oklahoma town is:", opts: ["Always prohibited with no nuance","Sometimes unavoidable and must be managed","Encouraged","Only a problem in cities"], correct: 1, exp: "Rural practice may involve unavoidable multiple relationships requiring careful management." },
  { q: "Telehealth counseling for Oklahoma clients:", opts: ["Has no rules","Must comply with Oklahoma licensure for the client's location","Is only for psychiatrists","Needs no consent"], correct: 1, exp: "The counselor must be appropriately licensed for where the client is located." },
  { q: "If a client threatens serious harm to an identifiable person, the counselor:", opts: ["Must always stay silent","May have a duty to protect consistent with law","Should post online","Only tells family"], correct: 1, exp: "Duty-to-protect principles may require action when imminent harm is foreseeable." },
  { q: "The primary purpose of Oklahoma counseling regulation is:", opts: ["Maximizing income","Protecting the public","Eliminating rural practice","Replacing national ethics"], correct: 1, exp: "Licensure exists primarily to protect public welfare." },
  { q: "Client records in Oklahoma must generally be:", opts: ["Destroyed daily","Retained per board rule","Posted publicly","Optional"], correct: 1, exp: "Record retention follows board rules after last contact." },
  { q: "An LPC candidate under supervision in Oklahoma:", opts: ["May practice with no oversight","Must practice under an approved supervisor","Can bill independently with no rules","Needs no hour logs"], correct: 1, exp: "Candidates accrue hours under board-approved supervision." },
  { q: "Advertising counseling services in Oklahoma must:", opts: ["Guarantee cures","Be truthful and not misleading","Always include testimonials","Hide credentials"], correct: 1, exp: "Advertising must be accurate." },
  { q: "A minor client in Oklahoma:", opts: ["Always has full confidentiality from parents","Has confidentiality with safety and parental-rights exceptions","Cannot receive counseling","Needs a court order for any session"], correct: 1, exp: "Minor confidentiality is limited and balanced with parental rights and safety." },
  { q: "Abandonment occurs when an LPC:", opts: ["Takes planned leave with coverage","Terminates suddenly without referral when still needed","Refers appropriately","Ends by mutual agreement"], correct: 1, exp: "Abrupt termination without continuity arrangements can be abandonment." },
  { q: "Privilege for counseling communications in Oklahoma:", opts: ["Does not exist","May be limited by court order or mandated reporting","Is absolute","Only applies to psychiatrists"], correct: 1, exp: "Privilege has exceptions including court orders and safety mandates." },
  { q: "Continuing education for Oklahoma LPCs is:", opts: ["Never required","Required on the renewal cycle","Only when changing jobs","Optional after year one"], correct: 1, exp: "Oklahoma requires ongoing CE for renewal." },
  { q: "Bartering for services:", opts: ["Is always fine","Requires careful consideration of exploitation risk","Is required in rural areas","Is banned by federal tax law only"], correct: 1, exp: "Bartering can create conflicts and should be handled with caution." },
  { q: "A client requests their records. The LPC should:", opts: ["Always refuse","Provide access consistent with law, with limited exceptions","Charge any amount","Destroy them first"], correct: 1, exp: "Clients generally have a right of access, with narrow exceptions." },
  { q: "Scope of practice for an Oklahoma LPC includes:", opts: ["Prescribing medication","Counseling within education and competence","Surgery","Legal representation"], correct: 1, exp: "Practice must stay within training, competence, and legal authorization." }
];

let mode = null, idx = 0, answers = {}, locked = {};
function startMode(m) {
  mode = m;
  document.getElementById('mode-modal').classList.remove('open');
  document.getElementById('mode-label').textContent = m === 'instant' ? 'Instant feedback' : 'Exam mode';
  render();
}
function render() {
  const q = QUESTIONS[idx];
  const main = document.getElementById('exam-main');
  const pct = Math.round(((idx) / QUESTIONS.length) * 100);
  let opts = '';
  q.opts.forEach((o, i) => {
    const sel = answers[idx] === i ? ' selected' : '';
    const mark = locked[idx] ? (i === q.correct ? ' correct' : (answers[idx] === i ? ' wrong' : '')) : '';
    opts += '<button class="opt' + sel + mark + '" onclick="pick(' + i + ')">' + o + '</button>';
  });
  let jumps = '';
  QUESTIONS.forEach((_, i) => {
    const cls = (i === idx ? ' current' : '') + (answers[i] !== undefined ? ' answered' : '');
    jumps += '<button class="jump-opt' + cls + '" onclick="jump(' + i + ')">' + (i + 1) + '</button>';
  });
  main.innerHTML = `
    <div class="exam-topbar">
      <div>Question ${idx + 1} of ${QUESTIONS.length}</div>
      <a class="btn-ghost" href="olere.html">Exit</a>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      ${opts}
      <div class="nav-row">
        <button class="btn-ghost" onclick="prev()">Previous</button>
        <button class="btn-lime" onclick="next()">${idx === QUESTIONS.length - 1 ? 'Finish' : 'Next'}</button>
      </div>
    </div>
    <div class="jump-wrap">
      <div class="jump-label">JUMP TO QUESTION</div>
      <div class="jump-grid">${jumps}</div>
    </div>`;
}
function pick(i) {
  if (locked[idx] && mode === 'instant') return;
  answers[idx] = i;
  if (mode === 'instant') {
    locked[idx] = true;
    const q = QUESTIONS[idx];
    const ok = i === q.correct;
    document.getElementById('fb-title').textContent = ok ? 'Correct' : 'Not quite';
    document.getElementById('fb-body').textContent = q.exp || '';
    document.getElementById('feedback-modal').classList.add('open');
  }
  render();
}
function closeFb() { document.getElementById('feedback-modal').classList.remove('open'); }
function jump(i) { idx = i; render(); }
function prev() { if (idx > 0) { idx--; render(); } }
function next() {
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
  else finish();
}
function finish() {
  let c = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) c++; });
  const pct = Math.round(c / QUESTIONS.length * 100);
  document.getElementById('exam-main').innerHTML = `
    <div class="q-card" style="text-align:center;padding:2rem;">
      <div style="font-family:'Archivo Black',sans-serif;font-size:1.6rem;">${c} / ${QUESTIONS.length}</div>
      <p style="color:var(--text-secondary);">${pct}%</p>
      <a class="btn-lime" href="olere.html" style="display:inline-block;margin-top:1rem;text-decoration:none;">Back to Hub</a>
    </div>`;
}
  </script>
<script src="theme.js"></script>
</body>
</html>
