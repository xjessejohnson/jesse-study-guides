<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CISSP Games | Jesse's Study Guides</title>
  <meta name="description" content="CISSP Games developed by Jesse—play Laser Blaster, Wheel of CISSP, ISACA Jeopardy, Unscramble Concepts, Tower Defender, and Beat the Clock." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Underlying CISSP Hub Layer with Description Banner */
    .hub-summary {
      background: rgba(16, 23, 38, 0.78);
      border: 1px solid var(--border-slate);
      border-left: 3px solid var(--cyan);
      border-radius: 10px;
      padding: 1.15rem 1.35rem;
      margin-bottom: 1.5rem;
      max-width: 780px;
    }
    .hub-summary p {
      color: var(--text-secondary);
      line-height: 1.68;
      font-size: 0.95rem;
    }
    .hub-summary strong { color: #fff; }
    .domain-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.85rem;
    }
    .domain-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      background: rgba(13, 18, 28, 0.9);
      border: 1px solid var(--border-slate);
      color: var(--text-secondary);
    }
    .domain-pill span { color: var(--lime); font-weight: 700; }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.25rem;
      margin-top: 1.25rem;
    }
    .module-card {
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 1.45rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.25rem;
      transition: all 0.2s ease;
    }
    .module-card.interactive:hover {
      border-color: var(--lime);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }
    .module-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }
    .module-card h3 {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.02rem;
      text-transform: uppercase;
      color: #fff;
    }
    .module-card p {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.55;
    }
    .btn-lime {
      padding: 0.75rem 1.25rem;
      border-radius: 9px;
      border: none;
      background: var(--lime);
      color: #05070c;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }
    .btn-lime:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 22px rgba(158, 255, 51, 0.35);
      transform: translateY(-1px);
    }

    /* =========================================================================
       TACTICAL ARCADE MENU OVERLAY (Appears Over Previous Menu with ✕ Button)
       ========================================================================= */
    .launcher-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9990;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
    }
    .launcher-modal-backdrop.open {
      display: flex;
      animation: backdropFade 0.22s ease-out;
    }

    .launcher-modal-window {
      background: #080c16;
      border: 1px solid rgba(34, 211, 238, 0.38);
      border-radius: 16px;
      width: 100%;
      max-width: 940px;
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.92), 0 0 35px rgba(34, 211, 238, 0.14);
      overflow: hidden;
      animation: cabinetZoomIn 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .launcher-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.4rem 0.9rem;
      border-bottom: 1px solid var(--border-slate);
      background: #0b111e;
    }

    .launcher-body {
      padding: 1.15rem 1.4rem 1.4rem;
      overflow-y: auto;
    }

    .arcade-intro-text {
      color: var(--text-secondary);
      line-height: 1.45;
      font-size: 0.94rem;
      margin-top: 0.25rem;
    }

    /* 5% Smaller Console Gaming Launcher Cards */
    .game-choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
      gap: 0.95rem;
      perspective: 1000px;
    }

    .game-selector-card {
      position: relative;
      border-radius: 13px;
      padding: 1.08rem 1.15rem;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      isolation: isolate;
    }

    .game-selector-card::after {
      content: "";
      position: absolute;
      inset: -50%;
      background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.12) 50%, transparent 60%);
      transform: translateX(-100%) rotate(15deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 1;
    }
    .game-selector-card:hover::after {
      transform: translateX(100%) rotate(15deg);
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .game-icon-badge {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .game-selector-card:hover .game-icon-badge {
      transform: scale(1.15) rotate(-6deg);
    }

    .game-play-pill {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      transition: all 0.25s ease;
    }
    .game-selector-card:hover .game-play-pill {
      transform: translateX(3px);
    }

    .game-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 1.04rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-top: 0.15rem;
    }

    .game-desc {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.42;
    }
    .game-desc strong { color: #fff; }

    /* 6 Distinct Game Card Themes */
    .card-blaster {
      background: radial-gradient(circle at 90% 10%, rgba(34, 211, 238, 0.22), transparent 55%), linear-gradient(145deg, #0b1528 0%, #070b14 100%);
      border-color: rgba(34, 211, 238, 0.35);
    }
    .card-blaster:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--cyan);
      box-shadow: 0 12px 30px rgba(34, 211, 238, 0.25);
    }
    .card-blaster .game-play-pill { color: var(--cyan); border: 1px solid rgba(34, 211, 238, 0.4); }

    .card-wheel {
      background: radial-gradient(circle at 90% 10%, rgba(251, 191, 36, 0.22), transparent 55%), linear-gradient(145deg, #21180b 0%, #090b12 100%);
      border-color: rgba(251, 191, 36, 0.35);
    }
    .card-wheel:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--amber);
      box-shadow: 0 12px 30px rgba(251, 191, 36, 0.22);
    }
    .card-wheel .game-play-pill { color: var(--amber); border: 1px solid rgba(251, 191, 36, 0.4); }

    .card-jeopardy {
      background: radial-gradient(circle at 90% 10%, rgba(129, 140, 248, 0.25), transparent 55%), linear-gradient(145deg, #131633 0%, #080b16 100%);
      border-color: rgba(129, 140, 248, 0.38);
    }
    .card-jeopardy:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: #818cf8;
      box-shadow: 0 12px 30px rgba(129, 140, 248, 0.25);
    }
    .card-jeopardy .game-play-pill { color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.45); }

    .card-scramble {
      background: radial-gradient(circle at 90% 10%, rgba(158, 255, 51, 0.2), transparent 55%), linear-gradient(145deg, #112211 0%, #070b12 100%);
      border-color: rgba(158, 255, 51, 0.35);
    }
    .card-scramble:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--lime);
      box-shadow: 0 12px 30px rgba(158, 255, 51, 0.22);
    }
    .card-scramble .game-play-pill { color: var(--lime); border: 1px solid rgba(158, 255, 51, 0.4); }

    .card-tower {
      background: radial-gradient(circle at 90% 10%, rgba(251, 113, 133, 0.22), transparent 55%), linear-gradient(145deg, #261019 0%, #080b12 100%);
      border-color: rgba(251, 113, 133, 0.38);
    }
    .card-tower:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--rose);
      box-shadow: 0 12px 30px rgba(251, 113, 133, 0.25);
    }
    .card-tower .game-play-pill { color: var(--rose); border: 1px solid rgba(251, 113, 133, 0.45); }

    .card-clock {
      background: radial-gradient(circle at 90% 10%, rgba(52, 211, 153, 0.22), transparent 55%), linear-gradient(145deg, #0b2420 0%, #070b12 100%);
      border-color: rgba(52, 211, 153, 0.38);
    }
    .card-clock:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: #34d399;
      box-shadow: 0 12px 30px rgba(52, 211, 153, 0.25);
    }
    .card-clock .game-play-pill { color: #34d399; border: 1px solid rgba(52, 211, 153, 0.45); }

    /* =========================================================================
       ACTIVE GAME MODAL (Arial High-Legibility Fonts +5% Larger)
       ========================================================================= */
    .arcade-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }
    .arcade-modal-backdrop.open {
      display: flex;
      animation: backdropFade 0.22s ease-out;
    }
    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .arcade-modal-window {
      background: #080c16;
      border: 1px solid rgba(34, 211, 238, 0.38);
      border-radius: 14px;
      width: 100%;
      max-width: 940px;
      height: calc(100dvh - 1rem);
      max-height: 700px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.92), 0 0 35px rgba(34, 211, 238, 0.14);
      overflow: hidden;
      animation: cabinetZoomIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      font-family: Arial, Helvetica, sans-serif;
    }
    @keyframes cabinetZoomIn {
      from { transform: scale(0.94) translateY(14px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .arcade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid var(--border-slate);
      background: #0b111e;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .arcade-game-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.92rem;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arcade-tracker-hud {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .arcade-stat-badge {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.24rem 0.55rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-slate);
      color: var(--cyan);
      white-space: nowrap;
    }
    .arcade-stat-badge.cash { color: var(--lime); border-color: rgba(158, 255, 51, 0.3); }
    .arcade-stat-badge.timer { color: var(--amber); border-color: rgba(251, 191, 36, 0.35); }
    .arcade-stat-badge.timer.urgent { color: var(--rose); border-color: rgba(251, 113, 133, 0.6); }

    .arcade-nav-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }
    .btn-hud-icon {
      background: #131c31;
      border: 1px solid var(--border-slate);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-hud-icon:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }
    .btn-hud-icon.close-btn {
      border-color: rgba(251, 113, 133, 0.5);
      color: var(--rose);
    }
    .btn-hud-icon.close-btn:hover {
      background: rgba(251, 113, 133, 0.22);
      color: #fff;
    }

    .arcade-body {
      flex: 1;
      padding: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .stage-screen {
      background: rgba(11, 17, 30, 0.94);
      border: 1px solid var(--border-slate);
      border-radius: 11px;
      padding: 0.85rem;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      animation: stageSwitch 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes stageSwitch {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .prompt-banner {
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 700;
      color: #fff;
      text-align: center;
      line-height: 1.4;
      padding: 0.3rem 0.5rem;
      flex-shrink: 0;
    }
    .prompt-banner span { color: var(--cyan); }

    .arcade-btn-action {
      background: var(--bg-sidebar);
      color: #fff;
      border: 1px solid var(--border-slate);
      border-radius: 8px;
      padding: 0.6rem 1.05rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .arcade-btn-action:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }

    /* =========================================================================
       1. LASER BLASTER
       ========================================================================= */
    .blaster-radar-screen {
      position: relative;
      background: #030712;
      border: 1.5px solid var(--cyan);
      border-radius: 10px;
      flex: 1;
      width: 100%;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(34, 211, 238, 0.14);
    }
    .radar-grid-lines {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(34,211,238,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.05) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .blaster-target-node {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(13, 18, 28, 0.96);
      border: 2px solid var(--rose);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(0.86rem, 2vw, 0.98rem);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      box-shadow: 0 0 14px rgba(251, 113, 133, 0.4);
      white-space: nowrap;
      z-index: 5;
      animation: gentleBob 2.4s ease-in-out infinite alternate;
    }
    @keyframes gentleBob {
      0% { margin-top: -4px; }
      100% { margin-top: 4px; }
    }
    .blaster-target-node.blasted {
      animation: none;
      border-color: var(--lime);
      background: rgba(158, 255, 51, 0.25);
      box-shadow: 0 0 24px var(--lime);
    }
    .cannon-turret {
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 48px;
      height: 48px;
      margin-left: -24px;
      background: radial-gradient(circle, #22d3ee 0%, #0e7490 80%);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 18px var(--cyan);
      z-index: 10;
      transition: transform 0.12s ease-out;
    }
    .cannon-barrel {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 20px;
      background: #fff;
      border: 1.5px solid var(--cyan);
      border-radius: 3px;
    }
    .laser-beam {
      position: absolute;
      background: linear-gradient(to top, var(--cyan), var(--lime), #ffffff);
      width: 4px;
      bottom: 32px;
      left: 50%;
      transform-origin: bottom center;
      box-shadow: 0 0 14px var(--lime), 0 0 5px #fff;
      border-radius: 999px;
      z-index: 8;
      display: none;
      pointer-events: none;
    }

    /* =========================================================================
       2. WHEEL OF CISSP
       ========================================================================= */
    .wheel-arena-layout {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      gap: 0.45rem;
    }
    .wheel-top-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      width: 100%;
    }
    .wheel-widget {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .wheel-pointer-down {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 16px solid var(--rose);
      margin-bottom: -4px;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(251,113,133,0.85));
    }
    .wheel-circle-wrap {
      position: relative;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      border: 2.5px solid var(--cyan);
      box-shadow: 0 0 16px rgba(34,211,238,0.22);
      overflow: hidden;
      background: #070b12;
    }
    .wheel-spin-center-btn {
      position: absolute;
      inset: 0;
      margin: auto;
      background: var(--bg-card);
      border: 2px solid var(--cyan);
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(34,211,238,0.45);
    }
    .wheel-spin-center-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .wheel-info-col {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-align: left;
      flex: 1;
      min-width: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wheel-slots {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      flex-wrap: wrap;
      width: 100%;
    }
    .wheel-slot {
      width: 30px;
      height: 36px;
      background: rgba(255,255,255,0.05);
      border: 1.5px solid var(--border-slate);
      border-radius: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.12rem;
      color: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 0.34rem;
      width: 100%;
    }
    .alpha-key {
      background: #131c31;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      padding: 0.46rem 0.15rem;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .alpha-key:hover:not(:disabled) { border-color: var(--cyan); background: var(--cyan-dim); }
    .alpha-key:disabled { opacity: 0.25; cursor: not-allowed; }

    /* =========================================================================
       3. ISACA JEOPARDY
       ========================================================================= */
    .jeopardy-grid-6x6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.35rem;
      flex: 1;
      align-content: stretch;
    }
    .jeopardy-cat-header {
