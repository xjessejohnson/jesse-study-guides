<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RED DIRT ARCADE | Jesse's Study Guides</title>
  <meta name="description" content="Oklahoma counseling law games." />
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #e8a87c; }
    .launcher-modal-backdrop, .arcade-modal-backdrop {
      position: fixed; inset: 0; background: rgba(5,8,14,0.92); display: none;
      align-items: center; justify-content: center; z-index: 40; padding: 1rem;
    }
    .launcher-modal-backdrop.open, .arcade-modal-backdrop.open { display: flex; }
    .launcher-modal-window {
      width: min(980px, 96vw); max-height: 92dvh; overflow: auto;
      background: #0e1524; border: 1px solid #243044; border-radius: 16px; padding: 1.25rem;
    }
    .launcher-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1rem; }
    .game-choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.85rem; }
    .game-selector-card {
      text-align: left; background: linear-gradient(160deg, #141c2e, #0b1220);
      border: 1px solid #243044; border-radius: 14px; padding: 1rem; cursor: pointer; color: #fff;
      transition: transform .15s, border-color .15s;
    }
    .game-selector-card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .game-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem; }
    .game-icon-badge { font-size: 1.6rem; }
    .game-play-pill { font-size: 0.72rem; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0.15rem 0.5rem; }
    .game-title { font-family: 'Archivo Black', sans-serif; font-size: 0.95rem; text-transform: uppercase; margin: 0.2rem 0; }
    .game-desc { font-size: 0.82rem; color: #94a3b8; line-height: 1.4; }
    .arcade-shell {
      width: min(920px, 96vw); height: min(92dvh, 760px); background: #0b1220;
      border: 1px solid #243044; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden;
    }
    .arcade-header {
      display: flex; justify-content: space-between; align-items: center; gap: 0.6rem;
      padding: 0.7rem 0.9rem; border-bottom: 1px solid #243044; background: #10182a;
    }
    .arcade-game-title { font-family: 'Archivo Black', sans-serif; font-size: 0.95rem; text-transform: uppercase; }
    .hud { display: flex; gap: 0.45rem; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; flex-wrap: wrap; }
    .hud-pill { background: #0b1220; border: 1px solid #243044; border-radius: 8px; padding: 0.28rem 0.5rem; }
    .btn-hud {
      background: #121927; color: #fff; border: 1px solid #243044; border-radius: 8px;
      padding: 0.35rem 0.6rem; cursor: pointer; font-weight: 700;
    }
    .btn-hud.close { border-color: rgba(251,113,133,.5); color: #fb7185; }
    .play-area { flex: 1; overflow: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .prompt {
      background: #141c2e; border: 1px solid #243044; border-radius: 12px; padding: 1.1rem;
      font-size: 1.05rem; line-height: 1.45; text-align: center;
    }
    .choices { display: grid; gap: 0.5rem; }
    .choice {
      background: #121927; border: 1.5px solid #243044; border-radius: 10px; padding: 0.8rem 0.9rem;
      color: #fff; text-align: left; cursor: pointer; font-size: 0.95rem;
    }
    .choice:hover { border-color: var(--accent); }
    .choice.good { border-color: #9eff33; background: rgba(158,255,51,.12); }
    .choice.bad { border-color: #fb7185; background: rgba(251,113,133,.12); }
    .mem-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .mem-card {
      aspect-ratio: 3/4; border-radius: 10px; border: 1px solid #243044; background: #121927;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 0.75rem; text-align: center; padding: 0.35rem; font-weight: 600;
    }
    .mem-card.flipped { background: #1a2740; border-color: var(--accent); }
    .mem-card.matched { background: rgba(158,255,51,.15); border-color: #9eff33; }
    .ladder { display: flex; flex-direction: column-reverse; gap: 0.3rem; }
    .rung { padding: 0.4rem 0.65rem; border-radius: 8px; background: #121927; border: 1px solid #243044; font-size: 0.8rem; }
    .rung.on { border-color: var(--accent); }
    .fb { min-height: 1.3rem; text-align: center; font-weight: 700; }
    .fb.good { color: #9eff33; }
    .fb.bad { color: #fb7185; }
    .timer { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
  </style>
</head>
<body>
  <div class="launcher-modal-backdrop open" id="launcher">
    <div class="launcher-modal-window">
      <div class="launcher-header">
        <div>
          <h2 class="hero-headline" style="font-size:clamp(1.4rem,3vw,2rem);margin:0.2rem 0;">RED DIRT ARCADE</h2>
        </div>
        <button class="btn-hud close" onclick="location.href='olere.html'" aria-label="Close">✕</button>
      </div>
      <div class="game-choice-grid">
          <button type="button" class="game-selector-card" onclick="launch('counsel')">
            <div class="game-card-top"><div class="game-icon-badge">🛎️</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Prairie Counsel</div>
            <div class="game-desc">Respond to Oklahoma practice scenarios. Three misses ends the run.</div>
          </button>
          <button type="button" class="game-selector-card" onclick="launch('match')">
            <div class="game-card-top"><div class="game-icon-badge">🃏</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Statute Match</div>
            <div class="game-desc">Flip cards and pair each rule with its meaning.</div>
          </button>
          <button type="button" class="game-selector-card" onclick="launch('ladder')">
            <div class="game-card-top"><div class="game-icon-badge">📈</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Sooner Ladder</div>
            <div class="game-desc">Climb ten rungs of Oklahoma ethics questions.</div>
          </button>
          <button type="button" class="game-selector-card" onclick="launch('blitz')">
            <div class="game-card-top"><div class="game-icon-badge">⚡</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Ethics Blitz</div>
            <div class="game-desc">45 seconds. Answer as many as you can.</div>
          </button>
          <button type="button" class="game-selector-card" onclick="launch('rural')">
            <div class="game-card-top"><div class="game-icon-badge">🌾</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Rural Boundaries</div>
            <div class="game-desc">Handle dual roles common in small Oklahoma towns.</div>
          </button>
          <button type="button" class="game-selector-card" onclick="launch('report')">
            <div class="game-card-top"><div class="game-icon-badge">📞</div><span class="game-play-pill">Play →</span></div>
            <div class="game-title">Report or Not</div>
            <div class="game-desc">Decide what must be reported and what stays in the room.</div>
          </button>
        </div>
    </div>
  </div>
  <div class="arcade-modal-backdrop" id="arcade">
    <div class="arcade-shell">
      <div class="arcade-header">
        <div class="arcade-game-title" id="gtitle">Game</div>
        <div class="hud">
          <div class="hud-pill" id="stat">Score 0</div>
          <div class="hud-pill timer" id="timer" style="display:none;"></div>
          <button class="btn-hud" onclick="shareGame()">Share</button>
          <button class="btn-hud" onclick="restart()" title="New game">↻ New</button>
          <button class="btn-hud close" onclick="closeGame()" title="Close">✕</button>
        </div>
      </div>
      <div class="play-area" id="play"></div>
    </div>
  </div>
  <script src="theme.js"></script>
  <script>
const GAMES = [{"id":"counsel","name":"Prairie Counsel","type":"scenario"},{"id":"match","name":"Statute Match","type":"memory"},{"id":"ladder","name":"Sooner Ladder","type":"ladder"},{"id":"blitz","name":"Ethics Blitz","type":"blitz","timed":true},{"id":"rural","name":"Rural Boundaries","type":"sort"},{"id":"report","name":"Report or Not","type":"scenario"}];
const DATA = {
    scenarios: [
      {client:"A client asks you to keep their affair secret from their spouse in couples work.", opts:["Keep it forever","Review the no-secrets policy from informed consent","Announce it next session without discussion","Report it to the board"], correct:1, exp:"Clarify the couples policy; do not collude in active deception."},
      {client:"I want to pay you in cash so insurance never sees this.", opts:["Fine, off the books","Transparent billing protects both of you","Only if under $50","Insurance fraud is the client's choice"], correct:1, exp:"Billing must match payer rules."},
      {client:"Can you tell me if my neighbor is also your client?", opts:["I can't confirm or deny","Yes, they come Tuesdays","I'll ask my cousin","Share general info"], correct:0, exp:"Confidentiality bars confirming client status."},
      {client:"I bought you a $400 watch as thanks.", opts:["I'll wear it","High-value gifts distort boundaries; let's talk about it","Put it toward copay","Hold it until we end"], correct:1, exp:"Decline expensive gifts and explore the meaning."}
    ],
    pairs: [
      {a:"Mandated report", b:"DHS or law enforcement"},
      {a:"LPC hours", b:"About 3,000 supervised"},
      {a:"OLERE", b:"Oklahoma law exam"},
      {a:"Informed consent", b:"Fees and limits up front"},
      {a:"Dual relationship", b:"Manage in small towns"},
      {a:"Abandonment", b:"Sudden end, no referral"},
      {a:"Privilege", b:"Limited by court or safety"},
      {a:"Telehealth", b:"License where client is"}
    ],
    ladder: [
      {q:"Who regulates Oklahoma LPCs?", opts:["Medical board","Behavioral Health Licensure board","DHS","NBCC only"], correct:1},
      {q:"Sexual contact with a current client is:", opts:["Negotiable","Prohibited","Fine after 6 months","Rural exception"], correct:1},
      {q:"Primary purpose of licensure:", opts:["Income","Public protection","Replacing ACA","Ending rural practice"], correct:1}
    ],
    blitz: [
      {q:"Report child abuse to DHS?", opts:["Yes","No"], correct:0},
      {q:"Date a current client?", opts:["Yes","No"], correct:1},
      {q:"Explain confidentiality limits?", opts:["Yes","No"], correct:0},
      {q:"Guarantee a cure in ads?", opts:["Yes","No"], correct:1}
    ]
  };
let current = null, score = 0, idx = 0, lives = 3, memState = null, timerId = null, timeLeft = 0;

function launch(id) {
  current = id; score = 0; idx = 0; lives = 3;
  document.getElementById('launcher').classList.remove('open');
  document.getElementById('arcade').classList.add('open');
  document.getElementById('gtitle').textContent = GAMES.find(g => g.id === id).name;
  startMode();
}
function closeGame() {
  clearInterval(timerId);
  document.getElementById('arcade').classList.remove('open');
  document.getElementById('launcher').classList.add('open');
}
function restart() { score = 0; idx = 0; lives = 3; clearInterval(timerId); startMode(); }
function setStat() { document.getElementById('stat').textContent = 'Score ' + score + (lives < 99 ? ' · Lives ' + lives : ''); }
function shareGame() {
  var url = location.href, title = document.title;
  if (navigator.share) navigator.share({ title: title, url: url }).catch(function(){});
  else window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(title + ' ' + url), '_blank', 'noopener');
}
function startMode() {
  const g = GAMES.find(x => x.id === current);
  document.getElementById('timer').style.display = g.timed ? '' : 'none';
  if (g.type === 'scenario') startScenario();
  else if (g.type === 'memory') startMemory();
  else if (g.type === 'ladder') startLadder();
  else if (g.type === 'blitz') startBlitz();
  else startSort();
}
function startScenario() {
  const bank = DATA.scenarios;
  const item = bank[idx % bank.length];
  setStat();
  document.getElementById('play').innerHTML = `<div class="prompt">"${item.client}"</div><div class="choices" id="chs"></div><div class="fb" id="fb"></div>`;
  const box = document.getElementById('chs');
  item.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = o;
    b.onclick = () => {
      if (box.dataset.done) return;
      box.dataset.done = '1';
      const ok = i === item.correct;
      b.classList.add(ok ? 'good' : 'bad');
      if (!ok) box.children[item.correct].classList.add('good');
      document.getElementById('fb').textContent = ok ? 'Correct' : item.exp;
      document.getElementById('fb').className = 'fb ' + (ok ? 'good' : 'bad');
      if (ok) score++; else lives--;
      setStat();
      setTimeout(() => { if (lives <= 0) endRun(); else { idx++; startScenario(); } }, 900);
    };
    box.appendChild(b);
  });
}
function startMemory() {
  const pairs = DATA.pairs.slice(0, 8);
  let cards = [];
  pairs.forEach((p, i) => {
    cards.push({ id: i, text: p.a, pair: i });
    cards.push({ id: i + 100, text: p.b, pair: i });
  });
  cards = cards.sort(() => Math.random() - 0.5);
  memState = { cards, flipped: [], matched: new Set() };
  setStat(); drawMemory();
}
function drawMemory() {
  const grid = memState.cards.map((c, i) => {
    const show = memState.flipped.includes(i) || memState.matched.has(c.pair);
    const cls = 'mem-card' + (show ? ' flipped' : '') + (memState.matched.has(c.pair) ? ' matched' : '');
    return `<button class="${cls}" onclick="flipMem(${i})">${show ? c.text : '★'}</button>`;
  }).join('');
  document.getElementById('play').innerHTML = `<div class="mem-grid">${grid}</div><div class="fb" id="fb"></div>`;
}
function flipMem(i) {
  const s = memState;
  if (s.flipped.length >= 2 || s.flipped.includes(i) || s.matched.has(s.cards[i].pair)) return;
  s.flipped.push(i); drawMemory();
  if (s.flipped.length === 2) {
    const [a, b] = s.flipped;
    if (s.cards[a].pair === s.cards[b].pair) {
      s.matched.add(s.cards[a].pair); score++; s.flipped = []; setStat();
      if (s.matched.size === 8) setTimeout(() => endRun(true), 400);
      else setTimeout(drawMemory, 200);
    } else {
      lives--; setStat();
      setTimeout(() => { s.flipped = []; if (lives <= 0) endRun(); else drawMemory(); }, 700);
    }
  }
}
function startLadder() {
  const bank = DATA.ladder;
  const item = bank[idx % bank.length];
  const rung = Math.min(idx, 9);
  setStat();
  const ladder = Array.from({length: 10}, (_, i) => `<div class="rung ${i === rung ? 'on' : ''}">Level ${i + 1}</div>`).join('');
  document.getElementById('play').innerHTML = `<div class="ladder">${ladder}</div><div class="prompt">${item.q}</div><div class="choices" id="chs"></div><div class="fb" id="fb"></div>`;
  const box = document.getElementById('chs');
  item.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = o;
    b.onclick = () => {
      if (box.dataset.done) return;
      box.dataset.done = '1';
      const ok = i === item.correct;
      b.classList.add(ok ? 'good' : 'bad');
      document.getElementById('fb').textContent = ok ? 'Climb' : 'Drop';
      document.getElementById('fb').className = 'fb ' + (ok ? 'good' : 'bad');
      if (ok) { score++; idx++; } else lives--;
      setStat();
      setTimeout(() => { if (lives <= 0 || idx >= 10) endRun(idx >= 10); else startLadder(); }, 700);
    };
    box.appendChild(b);
  });
}
function startSort() {
  const bank = DATA.sort;
  const item = bank[idx % bank.length];
  setStat();
  document.getElementById('play').innerHTML = `<div class="prompt">${item.text}</div><div class="choices" id="chs"></div><div class="fb" id="fb"></div>`;
  const box = document.getElementById('chs');
  item.labels.forEach((lab, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = lab;
    b.onclick = () => {
      if (box.dataset.done) return;
      box.dataset.done = '1';
      const ok = i === item.correct;
      b.classList.add(ok ? 'good' : 'bad');
      document.getElementById('fb').textContent = ok ? 'Yes' : 'No — ' + item.labels[item.correct];
      document.getElementById('fb').className = 'fb ' + (ok ? 'good' : 'bad');
      if (ok) score++; else lives--;
      setStat();
      setTimeout(() => { if (lives <= 0) endRun(); else { idx++; startSort(); } }, 600);
    };
    box.appendChild(b);
  });
}
function startBlitz() {
  timeLeft = 45; score = 0; idx = 0; lives = 99;
  document.getElementById('timer').style.display = '';
  document.getElementById('timer').textContent = timeLeft + 's';
  clearInterval(timerId);
  timerId = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft + 's';
    if (timeLeft <= 0) { clearInterval(timerId); endRun(true); }
  }, 1000);
  nextBlitz();
}
function nextBlitz() {
  const bank = DATA.blitz;
  const item = bank[idx % bank.length];
  setStat();
  document.getElementById('play').innerHTML = `<div class="prompt">${item.q}</div><div class="choices" id="chs"></div>`;
  const box = document.getElementById('chs');
  item.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = o;
    b.onclick = () => {
      if (i === item.correct) score++; else score = Math.max(0, score - 1);
      idx++; setStat(); nextBlitz();
    };
    box.appendChild(b);
  });
}
function endRun(win) {
  clearInterval(timerId);
  document.getElementById('play').innerHTML = `
    <div class="prompt">${win ? 'Clear' : 'Run over'}<br/>Score ${score}</div>
    <button class="choice" onclick="restart()">New game</button>
    <button class="choice" onclick="closeGame()">Back to menu</button>
    <button class="choice" onclick="shareGame()">Share result</button>`;
}
  </script>
</body>
</html>
