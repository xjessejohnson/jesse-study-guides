<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>License Ding | Jesse's Study Guides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #070b12;
      --bg-card: #0d121c;
      --bg-panel: #121927;
      --border-slate: #1e293b;
      --cyan: #22d3ee;
      --cyan-dim: rgba(34, 211, 238, 0.14);
      --lime: #34d399;
      --rose: #fb7185;
      --amber: #fbbf24;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1rem;
    }

    /* Compact width so wide desktop monitors don't stretch the room awkwardly */
    .arcade-shell {
      width: 100%;
      max-width: 780px;
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      padding: 1.05rem;
    }

    .top-hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.65rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--border-slate);
    }

    .brand-group .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--cyan);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-group h1 {
      font-family: 'Archivo Black', sans-serif;
      font-size: clamp(1.25rem, 3vw, 1.7rem);
      letter-spacing: 0.03em;
      color: #fff;
      text-transform: uppercase;
    }

    .hud-stats {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    .hud-pill {
      background: var(--bg-panel);
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .dings-pill {
      border-color: rgba(251, 113, 133, 0.45);
      background: rgba(251, 113, 133, 0.08);
    }

    .dings-count {
      color: var(--rose);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .progress-count {
      color: var(--cyan);
      font-weight: 700;
    }

    .restart-btn {
      background: var(--bg-panel);
      color: #fff;
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 0.48rem 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .restart-btn:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }

    /* Illustrated Therapy Office Scene */
    .office-scene {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-slate);
      background: #0b1220;
      display: flex;
      flex-direction: column;
    }

    .office-svg-wrap {
      position: relative;
      width: 100%;
      height: 310px;
      display: block;
    }

    .office-svg-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Clickable "Correct! Next Client" banner that stays until clicked */
    .correct-next-btn {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #04130d;
      border: 2px solid #a7f3d0;
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      padding: 0.55rem 1.25rem;
      border-radius: 999px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 0.45rem;
      z-index: 30;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .correct-next-btn.visible {
      display: inline-flex;
    }

    .correct-next-btn:hover {
      transform: translateX(-50%) scale(1.03);
      filter: brightness(1.06);
    }

    .client-dialogue-bar {
      background: rgba(9, 14, 23, 0.96);
      border-top: 1px solid var(--border-slate);
      padding: 0.95rem 1.15rem;
    }

    .dialogue-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.35rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--amber);
      text-transform: uppercase;
    }

    .client-statement {
      font-size: clamp(0.95rem, 2.1vw, 1.08rem);
      line-height: 1.52;
      color: #fff;
      font-weight: 500;
    }

    /* Response Options */
    .options-section {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .options-heading {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.7rem;
    }

    .response-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-slate);
      border-radius: 12px;
      padding: 0.9rem 0.95rem;
      color: var(--text-primary);
      text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem;
      line-height: 1.42;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
      min-height: 74px;
    }

    .response-btn:hover:not(:disabled) {
      border-color: var(--cyan);
      background: var(--cyan-dim);
      transform: translateY(-2px);
    }

    .response-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .opt-badge {
      flex-shrink: 0;
      width: 25px;
      height: 25px;
      border-radius: 7px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.35);
      color: var(--cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    /* Pop-up Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 15, 0.62);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      border: 1px solid var(--border-slate);
      border-radius: 16px;
      padding: 1.25rem 1.4rem;
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.85);
      position: relative;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-box.compact-ding {
      max-width: 410px;
      padding: 0.95rem 1.15rem;
      border-color: rgba(251, 113, 133, 0.75);
    }

    .modal-box.ding-alert {
      border-color: rgba(251, 113, 133, 0.65);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
      padding-bottom: 0.55rem;
      border-bottom: 1px solid var(--border-slate);
    }

    .modal-title {
      font-family: 'Archivo Black', sans-serif;
      font-size: 0.92rem;
      color: var(--rose);
      text-transform: uppercase;
      line-height: 1.3;
    }

    .modal-title.revoked {
      font-size: 1.08rem;
    }

    .modal-title.victory {
      color: var(--lime);
    }

    .close-x-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-slate);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .close-x-btn:hover {
      border-color: var(--rose);
      color: var(--rose);
    }

    .modal-body-text {
      font-size: 0.92rem;
      line-height: 1.48;
      color: var(--text-primary);
    }

    .revocation-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 0.9rem;
    }

    .revocation-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-slate);
      border-left: 3px solid var(--rose);
      border-radius: 10px;
      padding: 0.8rem 0.95rem;
      text-align: left;
    }

    .revocation-card .q-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      color: var(--amber);
      margin-bottom: 0.25rem;
    }

    .revocation-card .wrong-ans {
      font-size: 0.85rem;
      color: var(--rose);
      margin-bottom: 0.25rem;
    }

    .revocation-card .right-ans {
      font-size: 0.87rem;
      color: var(--lime);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .revocation-card .why-ans {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.42;
    }

    .modal-footer-actions {
      margin-top: 1.15rem;
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .primary-action-btn {
      background: var(--cyan);
      color: #061018;
      border: none;
      border-radius: 10px;
      padding: 0.72rem 1.15rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-action-btn:hover {
      filter: brightness(1.08);
    }

    .secondary-action-btn {
      background: var(--bg-panel);
      color: #fff;
      border: 1px solid var(--border-slate);
      border-radius: 10px;
      padding: 0.72rem 1.15rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }

    .secondary-action-btn:hover {
      border-color: var(--cyan);
      background: var(--cyan-dim);
    }

    @media (max-width: 680px) {
      .options-grid {
        grid-template-columns: 1fr;
      }

      .office-svg-wrap {
        height: 265px;
      }

      .arcade-shell {
        padding: 0.85rem;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="arcade-shell">
    <div class="top-hud">
      <div class="brand-group">
        <div class="tag">NCE Clinical Practice</div>
        <h1>LICENSE DING</h1>
      </div>

      <div class="hud-stats">
        <div class="hud-pill">
          <span>Client:</span>
          <strong class="progress-count" id="client-progress">1 of 20</strong>
        </div>
        <div class="hud-pill dings-pill">
          <span>Dings:</span>
          <span class="dings-count" id="dings-counter">0 / 3</span>
        </div>
        <button type="button" class="restart-btn" id="new-session-btn">New Sessions?</button>
      </div>
    </div>

    <div class="office-scene">
      <div class="office-svg-wrap">
        <!-- Stays on screen until clicked -->
        <button type="button" class="correct-next-btn" id="correct-next-btn">Correct! Next Client</button>

        <svg viewBox="0 0 920 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Detailed therapy office room with client and therapist seated across a desk">
          <defs>
            <linearGradient id="officeWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1c2a44" />
              <stop offset="100%" stop-color="#111a2b" />
            </linearGradient>
            <linearGradient id="wainscotWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#172338" />
              <stop offset="100%" stop-color="#101827" />
            </linearGradient>
            <linearGradient id="woodFloor" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#311f14" />
              <stop offset="100%" stop-color="#1a100a" />
            </linearGradient>
            <linearGradient id="deskSurface" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#a44d18" />
              <stop offset="100%" stop-color="#682d0c" />
            </linearGradient>
            <linearGradient id="windowGlass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#19426b" />
              <stop offset="65%" stop-color="#2c6391" />
              <stop offset="100%" stop-color="#437ba8" />
            </linearGradient>
            <radialGradient id="floorRug" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#2a3d5c" stop-opacity="0.72" />
              <stop offset="100%" stop-color="#162133" stop-opacity="0.15" />
            </radialGradient>
          </defs>

          <!-- Wall, Chair Rail & Wainscoting -->
          <rect x="0" y="0" width="920" height="162" fill="url(#officeWall)" />
          <rect x="0" y="162" width="920" height="44" fill="url(#wainscotWall)" />
          <rect x="0" y="160" width="920" height="5" fill="#394c6e" />
          <rect x="0" y="204" width="920" height="6" fill="#25334a" />

          <!-- Floor Planks & Woven Rug -->
          <rect x="0" y="210" width="920" height="110" fill="url(#woodFloor)" />
          <line x1="0" y1="236" x2="920" y2="236" stroke="#130b07" stroke-width="2" />
          <line x1="0" y1="264" x2="920" y2="264" stroke="#130b07" stroke-width="2" />
          <line x1="0" y1="292" x2="920" y2="292" stroke="#130b07" stroke-width="2" />
          <ellipse cx="460" cy="252" rx="330" ry="34" fill="url(#floorRug)" stroke="#3e567d" stroke-width="1.5" />

          <!-- Center Window with Curtains & Daylight -->
          <rect x="372" y="24" width="176" height="112" rx="9" fill="url(#windowGlass)" stroke="#475569" stroke-width="5" />
          <line x1="460" y1="24" x2="460" y2="136" stroke="#475569" stroke-width="3.5" />
          <line x1="372" y1="80" x2="548" y2="80" stroke="#475569" stroke-width="3.5" />
          <rect x="366" y="136" width="188" height="7" rx="2.5" fill="#64748b" />
          <!-- Curtains -->
          <path d="M364 20 L388 20 L382 143 L360 143 Z" fill="#334155" opacity="0.85" />
          <path d="M556 20 L532 20 L538 143 L560 143 Z" fill="#334155" opacity="0.85" />
          <!-- Soft Sunlight Cone -->
          <polygon points="374,136 546,136 650,282 270,282" fill="rgba(186, 230, 253, 0.05)" />

          <!-- Compact, Tasteful Diploma Frame on Left Wall -->
          <rect x="74" y="54" width="64" height="46" rx="3" fill="#f8fafc" stroke="#b45309" stroke-width="3" />
          <line x1="84" y1="67" x2="128" y2="67" stroke="#334155" stroke-width="2.2" stroke-linecap="round" />
          <line x1="84" y1="76" x2="120" y2="76" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
          <line x1="84" y1="84" x2="108" y2="84" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
          <circle cx="126" cy="89" r="5.5" fill="#eab308" stroke="#a16207" stroke-width="1.2" />

          <!-- Indoor Monstera / Leaf Plant -->
          <rect x="304" y="168" width="30" height="36" rx="4" fill="#9a3412" />
          <rect x="301" y="164" width="36" height="6" rx="2" fill="#c2410c" />
          <path d="M319 164 Q300 138 286 144 Q303 154 319 164 Z" fill="#10b981" />
          <path d="M319 164 Q319 124 321 122 Q329 140 319 164 Z" fill="#34d399" />
          <path d="M319 164 Q338 136 352 144 Q335 154 319 164 Z" fill="#059669" />

          <!-- Right Wall Bookshelf -->
          <rect x="735" y="34" width="132" height="122" rx="4" fill="#4a2e1b" stroke="#29170c" stroke-width="3" />
          <line x1="735" y1="74" x2="867" y2="74" stroke="#29170c" stroke-width="3.5" />
          <line x1="735" y1="114" x2="867" y2="114" stroke="#29170c" stroke-width="3.5" />
          <rect x="745" y="44" width="15" height="27" rx="1.5" fill="#22d3ee" />
          <rect x="763" y="48" width="13" height="23" rx="1.5" fill="#34d399" />
          <rect x="779" y="42" width="17" height="29" rx="1.5" fill="#fb7185" />
          <rect x="799" y="50" width="14" height="21" rx="1.5" fill="#fbbf24" />
          <rect x="747" y="84" width="18" height="27" rx="1.5" fill="#818cf8" />
          <rect x="768" y="87" width="15" height="24" rx="1.5" fill="#f472b6" />
          <rect x="786" y="82" width="13" height="29" rx="1.5" fill="#38bdf8" />

          <!-- Client Armchair (Left) -->
          <rect x="148" y="146" width="20" height="84" rx="6" fill="#334155" />
          <rect x="148" y="204" width="90" height="20" rx="7" fill="#475569" />
          <rect x="150" y="190" width="86" height="15" rx="5" fill="#64748b" />
          <rect x="160" y="224" width="8" height="44" rx="2" fill="#1e293b" />
          <rect x="218" y="224" width="8" height="44" rx="2" fill="#1e293b" />

          <!-- Client Character (Seated Left, Facing Right Toward Desk/Therapist) -->
          <g id="client-character-group">
            <!-- Legs -->
            <rect x="188" y="206" width="13" height="46" rx="5" fill="#1e293b" />
            <rect x="207" y="206" width="13" height="46" rx="5" fill="#1e293b" />
            <!-- Shoes -->
            <ellipse cx="195" cy="254" rx="11" ry="4.5" fill="#0f172a" />
            <ellipse cx="215" cy="254" rx="11" ry="4.5" fill="#0f172a" />
            <!-- Back Hair (Rendered Behind Shoulders & Neck) -->
            <g id="client-hair-back"></g>
            <!-- Shirt / Torso -->
            <path id="client-shirt" d="M180 152 Q203 145 226 152 L231 208 L176 208 Z" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
            <path id="client-collar" d="M194 150 L203 162 L212 150" fill="none" stroke="#e0f2fe" stroke-width="2.4" stroke-linecap="round" />
            <!-- Arm & Hand -->
            <path id="client-arm" d="M218 160 L242 182 L228 192" stroke="#f1c29b" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <circle id="client-hand" cx="228" cy="192" r="4.8" fill="#f1c29b" />
            <!-- Head & Ears -->
            <circle id="client-head" cx="203" cy="122" r="21" fill="#f1c29b" stroke="#0f172a" stroke-width="1.8" />
            <circle id="client-ear-l" cx="182" cy="124" r="4" fill="#f1c29b" />
            <circle id="client-ear-r" cx="224" cy="124" r="4" fill="#f1c29b" />
            <!-- Eyes & Eyebrows -->
            <circle cx="198" cy="121" r="2.5" fill="#0f172a" />
            <circle cx="213" cy="121" r="2.5" fill="#0f172a" />
            <circle cx="198.7" cy="120.2" r="0.85" fill="#ffffff" />
            <circle cx="213.7" cy="120.2" r="0.85" fill="#ffffff" />
            <path id="client-brow-l" d="M193 115 Q198 113 202 115" stroke="#1e293b" stroke-width="1.9" fill="none" stroke-linecap="round" />
            <path id="client-brow-r" d="M209 115 Q214 113 218 115" stroke="#1e293b" stroke-width="1.9" fill="none" stroke-linecap="round" />
            <!-- Nose & Mouth -->
            <path d="M206 121 L204 127 L207 128" stroke="#9a5b3c" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            <path id="client-mouth" d="M200 134 Q206 131 212 134" stroke="#7c2d12" stroke-width="2.1" fill="none" stroke-linecap="round" />
            <!-- Front Hair Cap (Aligned cleanly on top of head circle r=21 centered at 203,122) -->
            <g id="client-hair-front"></g>
          </g>

          <!-- Single Client Name Badge Near Client -->
          <rect id="client-badge-bg" x="155" y="274" width="96" height="22" rx="6" fill="#121c2e" stroke="#38bdf8" stroke-width="1.5" />
          <text id="client-svg-label" x="203" y="289" text-anchor="middle" fill="#7dd3fc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">JORDAN</text>

          <!-- Office Desk (Center) -->
          <rect x="366" y="190" width="188" height="15" rx="5" fill="url(#deskSurface)" stroke="#451a03" stroke-width="2.5" />
          <rect x="376" y="205" width="168" height="11" fill="#5c280a" />
          <rect x="386" y="216" width="15" height="62" fill="#451a03" />
          <rect x="519" y="216" width="15" height="62" fill="#451a03" />
          <!-- Desk Items -->

      {
        domain: "Professional Orientation & Ethics",
        client: "We were close friends in college—can I become your counseling client because I trust you more than a stranger?",
        options: [
          "Yes, trust is the most important part of therapy.",
          "A prior friendship creates a multiple relationship that could impair objectivity, so I can offer referrals instead.",
          "I'll take you on only if you don't pay a fee.",
          "Let's try three sessions to see how it feels."
        ],
        correct: 1,
        explanation: "Avoiding dual/multiple relationships with close friends preserves clinical objectivity and protects the client; providing referrals is ethical care."
      },
      {
        domain: "Helping Relationships",
        client: "Every time I set a boundary with my sister, she cries and calls me selfish.",
        options: [
          "If she cries, your boundary must be too harsh.",
          "Setting a boundary can trigger pushback even when it's healthy—how can you stay f{irm} while staying compassionate?",
          "Stop setting boundaries with her completely.",
          "Tell her she's manipulating you whenever she cries."
        ],
        correct: 1,
        explanation: "Distinguishing between a healthy boundary and another person's emotional reaction supports sustainable assertiveness."
      },
      {
        domain: "Human Growth & Development",
        client: "My 8-year-old worries that a burglar will get in through the bedroom window even after we check the locks.",
        options: [
          "Tell them there's nothing to be afraid of and turn off the light.",
          "Validate their fear without reinforcing danger, and practice simple calming steps alongside age-appropriate reassurance.",
          "Lock their bedroom door from the outside so they feel safe.",
          "Explain crime statistics to show how unlikely a burglar is."
        ],
        correct: 1,
        explanation: "Validating emotion while avoiding reassurance loops or frightening details helps school-age children regulate anxiety."
      },
      {
        domain: "Social & Cultural Foundations",
        client: "I feel uncomfortable talking about money because in my upbringing financial struggles were kept secret.",
        options: [
          "Money stress affects mental health too—we can move gently and talk about what feels manageable to share.",
          "You have to talk openly about finances if you want real help.",
          "Keeping money private means you're ashamed of your family.",
          "We don't ever need to mention money in counseling."
        ],
        correct: 0,
        explanation: "Acknowledging family norms around secrecy while inviting gradual exploration respects autonomy and builds safety."
      },
      {
        domain: "Group Work",
        client: "As the group ends, I feel like nobody here actually listens to me.",
        options: [
          "You're being too sensitive after a good session.",
          "Let's invite the group to check in on that experience rather than brushing past it before we close.",
          "We're out of time, so we won't bring it up.",
          "Let's have everyone vote on whether they listen."
        ],
        correct: 1,
        explanation: "Addressing process feedback directly in group promotes accountability, repair, and therapeutic engagement."
      },
      {
        domain: "Career Development",
        client: "I've worked in retail management for ten years and feel stuck because my resume only lists store operations.",
        options: [
          "Ten years of management includes leadership, training, scheduling, and problem-solving—let's translate those skills.",
          "Without a corporate title, it's hard to pivot careers.",
          "You'll probably have to start at entry level in any new field.",
          "Just rewrite your job titles to sound more senior."
        ],
        correct: 0,
        explanation: "Identifying transferable skills helps mid-career clients connect past experience to new occupational pathways."
      }
    ];

    function buildTwoHundredScenarios() {
      const result = [];
      for (let i = 0; i < 200; i++) {
        const template = BASE_NCE_BANK[i % BASE_NCE_BANK.length];
        const persona = CLIENT_PERSONAS[i % CLIENT_PERSONAS.length];
        result.push({
          persona,
          domain: template.domain,
          client: template.client,
          options: [...template.options],
          correct: template.correct,
          explanation: template.explanation
        });
      }
      return result;
    }

    const NCE_SCENARIOS = buildTwoHundredScenarios();
    const GAMES_PER_RUN = 20;
    const MAX_DINGS = 3;

    let sessionQuestions = [];
    let currentIndex = 0;
    let dings = 0;
    let wrongAnswersLog = [];
    let gameOver = false;
    let awaitingNextClick = false;

    const clientProgressEl = document.getElementById("client-progress");
    const dingsCounterEl = document.getElementById("dings-counter");
    const scenarioDomainEl = document.getElementById("scenario-domain");
    const clientSvgLabelEl = document.getElementById("client-svg-label");
    const clientBadgeBgEl = document.getElementById("client-badge-bg");
    const clientStatementEl = document.getElementById("client-statement");
    const optionsGridEl = document.getElementById("options-grid");
    const newSessionBtn = document.getElementById("new-session-btn");
    const correctNextBtn = document.getElementById("correct-next-btn");

    const clientHeadEl = document.getElementById("client-head");
    const clientEarLEl = document.getElementById("client-ear-l");
    const clientEarREl = document.getElementById("client-ear-r");
    const clientArmEl = document.getElementById("client-arm");
    const clientHandEl = document.getElementById("client-hand");
    const clientShirtEl = document.getElementById("client-shirt");
    const clientCollarEl = document.getElementById("client-collar");
    const clientHairBackEl = document.getElementById("client-hair-back");
    const clientHairFrontEl = document.getElementById("client-hair-front");
    const clientMouthEl = document.getElementById("client-mouth");

    const feedbackModalEl = document.getElementById("feedback-modal");
    const feedbackModalBoxEl = document.getElementById("feedback-modal-box");
    const feedbackModalTitleEl = document.getElementById("feedback-modal-title");
    const feedbackModalBodyEl = document.getElementById("feedback-modal-body");
    const feedbackModalFooterEl = document.getElementById("feedback-modal-footer");
    const closeModalXBtn = document.getElementById("close-modal-x");

    function shuffleArray(list) {
      const copy = [...list];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyClientPersona(persona) {
      clientHeadEl.setAttribute("fill", persona.skin);
      clientEarLEl.setAttribute("fill", persona.skin);
      clientEarREl.setAttribute("fill", persona.skin);
      clientArmEl.setAttribute("stroke", persona.skin);
      clientHandEl.setAttribute("fill", persona.skin);
      clientShirtEl.setAttribute("fill", persona.shirt);
      clientCollarEl.setAttribute("stroke", persona.collar);
      clientMouthEl.setAttribute("stroke", persona.shade);

      const upperName = persona.name.toUpperCase();
      clientSvgLabelEl.textContent = upperName;
      const badgeWidth = Math.max(88, upperName.length * 8.5 + 24);
      clientBadgeBgEl.setAttribute("width", badgeWidth);
      clientBadgeBgEl.setAttribute("x", 203 - badgeWidth / 2);

      // Head is circle cx="203" cy="122" r="21" (top at y=101, sides at x=182..224)
      let backSvg = "";
      let frontSvg = "";

      if (persona.style === "long") {
        backSvg = `<path d="M181 118 C179 152, 184 174, 192 178 L214 178 C222 174, 227 152, 225 118 Z" fill="${persona.hair}" />`;
        frontSvg = `<path d="M182 120 C182 97, 224 97, 224 120 C217 107, 206 105, 196 107 C189 108, 185 113, 182 120 Z" fill="${persona.hair}" />`;
      } else if (persona.style === "bob") {
        backSvg = `<path d="M181 119 C181 143, 186 150, 193 150 L213 150 C220 150, 225 143, 225 119 Z" fill="${persona.hair}" />`;
        frontSvg = `<path d="M182 120 C182 98, 224 98, 224 120 C214 106, 196 105, 182 120 Z" fill="${persona.hair}" />`;
      } else if (persona.style === "ponytail") {
        backSvg = `<path d="M185 110 C166 114, 168 142, 174 150 C179 138, 184 125, 188 116 Z" fill="${persona.hair}" />`;
        frontSvg = `<path d="M182 120 C182 98, 224 98, 224 120 C213 106, 195 106, 182 120 Z" fill="${persona.hair}" />`;
      } else if (persona.style === "fade") {
        frontSvg = `<path d="M183 118 C184 100, 222 100, 223 118 C215 108, 207 107, 199 107 C192 107, 187 111, 183 118 Z" fill="${persona.hair}" />`;
      } else {
        frontSvg = `<path d="M182 120 C182 98, 224 98, 224 120 C216 107, 205 105, 194 107 C188 108, 184 113, 182 120 Z" fill="${persona.hair}" />`;
      }

      clientHairBackEl.innerHTML = backSvg;
      clientHairFrontEl.innerHTML = frontSvg;
    }

    function startNewRun() {
      feedbackModalEl.classList.remove("open");
      correctNextBtn.classList.remove("visible");
      awaitingNextClick = false;
      dings = 0;
      currentIndex = 0;
      wrongAnswersLog = [];
      gameOver = false;

      const picked = shuffleArray(NCE_SCENARIOS).slice(0, GAMES_PER_RUN);
      sessionQuestions = picked.map((item) => {
        const indexedOptions = item.options.map((text, idx) => ({
          text,
          isCorrect: idx === item.correct
        }));
        const shuffledOptions = shuffleArray(indexedOptions);
        const correctShuffledIndex = shuffledOptions.findIndex((o) => o.isCorrect);
        return {
          persona: item.persona,
          domain: item.domain,
          client: item.client,
          options: shuffledOptions.map((o) => o.text),
          correctIndex: correctShuffledIndex,
          explanation: item.explanation
        };
      });

      updateHud();
      renderScenario();
    }

    function updateHud() {
      const displayNum = Math.min(currentIndex + 1, GAMES_PER_RUN);
      clientProgressEl.textContent = `${displayNum} of ${GAMES_PER_RUN}`;
      dingsCounterEl.textContent = `${dings} / ${MAX_DINGS}`;
    }

    function renderScenario() {
      if (gameOver) return;
      correctNextBtn.classList.remove("visible");
      awaitingNextClick = false;

      if (currentIndex >= sessionQuestions.length) {
        showVictoryModal();
        return;
      }

      const q = sessionQuestions[currentIndex];
      updateHud();
      applyClientPersona(q.persona);
      scenarioDomainEl.textContent = `DOMAIN: ${q.domain.toUpperCase()}`;
      clientStatementEl.textContent = `"${q.client}"`;

      const badges = ["A", "B", "C", "D"];
      optionsGridEl.innerHTML = "";

      q.options.forEach((optText, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "response-btn";
        btn.innerHTML = `<span class="opt-badge">${badges[idx]}</span><span>${escapeHtml(optText)}</span>`;
        btn.addEventListener("click", () => handleOptionSelect(idx));
        optionsGridEl.appendChild(btn);
      });
    }

    function setOptionsDisabled(disabled) {
      const buttons = optionsGridEl.querySelectorAll("button");
      buttons.forEach((b) => {
        b.disabled = disabled;
      });
    }

    function handleOptionSelect(chosenIndex) {
      if (gameOver || awaitingNextClick) return;
      const q = sessionQuestions[currentIndex];
      setOptionsDisabled(true);

      if (chosenIndex === q.correctIndex) {
        // Stays on screen until the user clicks "Correct! Next Client"
        awaitingNextClick = true;
        correctNextBtn.classList.add("visible");
        return;
      }

      dings += 1;
      updateHud();

      wrongAnswersLog.push({
        clientName: q.persona.name,
        domain: q.domain,
        client: q.client,
        chosenText: q.options[chosenIndex],
        correctText: q.options[q.correctIndex],
        explanation: q.explanation
      });

      if (dings >= MAX_DINGS) {
        gameOver = true;
        showRevokedModal();
      } else {
        showSingleDingModal();
      }
    }

    correctNextBtn.addEventListener("click", () => {
      if (!awaitingNextClick) return;
      correctNextBtn.classList.remove("visible");
      awaitingNextClick = false;
      currentIndex += 1;
      renderScenario();
    });

    function showSingleDingModal() {
      feedbackModalBoxEl.className = "modal-box ding-alert compact-ding";
      feedbackModalTitleEl.className = "modal-title";
      feedbackModalTitleEl.textContent = "That is not how a licensed therapist should respond to a client";
      closeModalXBtn.style.display = "flex";
      feedbackModalBodyEl.innerHTML = `<p>Ding <strong>${dings} of ${MAX_DINGS}</strong>.</p>`;
      feedbackModalFooterEl.innerHTML = "";
      feedbackModalEl.classList.add("open");
    }

    function showRevokedModal() {
      feedbackModalBoxEl.className = "modal-box ding-alert";
      feedbackModalTitleEl.className = "modal-title revoked";
      feedbackModalTitleEl.textContent = "The board has revoked your license as a therapist";
      closeModalXBtn.style.display = "flex";

      const cardsHtml = wrongAnswersLog
        .map((entry) => `
          <div class="revocation-card">
            <div class="q-label">${escapeHtml(entry.clientName)} • ${escapeHtml(entry.domain)}</div>
            <div class="wrong-ans"><strong>Your response:</strong> ${escapeHtml(entry.chosenText)}</div>
            <div class="right-ans"><strong>What you should have said:</strong> ${escapeHtml(entry.correctText)}</div>
            <div class="why-ans">${escapeHtml(entry.explanation)}</div>
          </div>
        `)
        .join("");

      feedbackModalBodyEl.innerHTML = `
        <p>You reached <strong>3 Dings</strong>. What you should have said:</p>
        <div class="revocation-list">${cardsHtml}</div>
      `;

      feedbackModalFooterEl.innerHTML = `
        <button type="button" class="primary-action-btn" id="modal-restart-btn">New Sessions?</button>
        <a href="nce.html" class="secondary-action-btn">Choose a Different Game</a>
      `;

      document.getElementById("modal-restart-btn").addEventListener("click", startNewRun);
      feedbackModalEl.classList.add("open");
    }

    function showVictoryModal() {
      gameOver = true;
      feedbackModalBoxEl.className = "modal-box";
      feedbackModalTitleEl.className = "modal-title victory";
      feedbackModalTitleEl.textContent = "Good job helping the client!";
      closeModalXBtn.style.display = "flex";

      let reviewSection = `<p>Completed with <strong>${dings}</strong> of ${MAX_DINGS} dings.</p>`;

      if (wrongAnswersLog.length > 0) {
        const cardsHtml = wrongAnswersLog
          .map((entry) => `
            <div class="revocation-card">
              <div class="q-label">${escapeHtml(entry.clientName)} • ${escapeHtml(entry.domain)}</div>
              <div class="wrong-ans"><strong>Your response:</strong> ${escapeHtml(entry.chosenText)}</div>
              <div class="right-ans"><strong>What you should have said:</strong> ${escapeHtml(entry.correctText)}</div>
              <div class="why-ans">${escapeHtml(entry.explanation)}</div>
            </div>
          `)
          .join("");
        reviewSection += `<div class="revocation-list">${cardsHtml}</div>`;
      }

      feedbackModalBodyEl.innerHTML = reviewSection;
      feedbackModalFooterEl.innerHTML = `
        <button type="button" class="primary-action-btn" id="modal-victory-restart-btn">New Sessions?</button>
        <a href="nce.html" class="secondary-action-btn">Choose a Different Game</a>
      `;

      document.getElementById("modal-victory-restart-btn").addEventListener("click", startNewRun);
      feedbackModalEl.classList.add("open");
    }

    closeModalXBtn.addEventListener("click", () => {
      feedbackModalEl.classList.remove("open");
      if (!gameOver) {
        currentIndex += 1;
        renderScenario();
      }
    });

    newSessionBtn.addEventListener("click", startNewRun);

    startNewRun();
  </script>
</body>
</html>
