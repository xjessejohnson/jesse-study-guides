    .btn-lime { padding:0.78rem 1.45rem; border-radius:9px; border:none; background:var(--lime); color:#05070c; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:0.82rem; text-transform:uppercase; cursor:pointer; }
    .progress-track { width:100%; height:5px; background:rgba(148,163,184,0.14); border-radius:999px; overflow:hidden; margin-bottom:1.4rem; }
    .progress-fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--lime)); transition:width 0.25s ease; }
    .q-card { background:var(--bg-card); border:1px solid var(--border-slate); border-radius:12px; padding:1.35rem; }
    .q-text { font-size:1.08rem; line-height:1.5; margin-bottom:1rem; color:#fff; }
    .opt { display:block; width:100%; text-align:left; background:#121927; border:1.5px solid var(--border-slate); border-radius:10px; padding:0.8rem 1rem; margin-bottom:0.5rem; color:#fff; cursor:pointer; font-size:0.95rem; }

    .opt.selected { border-color:var(--lime); background:rgba(158,255,51,0.1); }
    .opt.correct { border-color:var(--lime); }
    .opt.wrong { border-color:var(--rose); }

    .jump-opt { padding:0.4rem; border-radius:6px; border:1px solid transparent; background:rgba(255,255,255,0.04); color:var(--text-secondary); font-family:'JetBrains Mono',monospace; font-size:0.72rem; text-align:center; cursor:pointer; }

    .jump-opt.current { background:var(--lime); color:#05070c; font-weight:700; }
    .mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; margin-top:1rem; }
    .mode-choice { background:#121927; border:1.5px solid var(--border-slate); border-radius:12px; padding:1.1rem; text-align:left; cursor:pointer; color:#fff; }
    .mode-choice:hover { border-color:var(--lime); }
    .mode-choice-title { font-weight:700; margin-bottom:0.3rem; }
    .mode-choice-desc { font-size:0.85rem; color:var(--text-secondary); }

let mode = null, idx = 0, answers = {}, locked = {};
function startMode(m) {
  mode = m;
  document.getElementById('mode-modal').classList.remove('open');
  document.getElementById('mode-label').textContent = m === 'instant' ? 'Instant feedback' : 'Exam mode';
  render();
}
function render() {
  const q = QUESTIONS[idx];
  const main = document.getElementById('exam-main');
  const pct = Math.round(((idx) / QUESTIONS.length) * 100);
  let opts = '';
  q.opts.forEach((o, i) => {
    const sel = answers[idx] === i ? ' selected' : '';
    const mark = locked[idx] ? (i === q.correct ? ' correct' : (answers[idx] === i ? ' wrong' : '')) : '';
    opts += '<button class="opt' + sel + mark + '" onclick="pick(' + i + ')">' + o + '</button>';
  });
  let jumps = '';
  QUESTIONS.forEach((_, i) => {
    const cls = (i === idx ? ' current' : '') + (answers[i] !== undefined ? ' answered' : '');
    jumps += '<button class="jump-opt' + cls + '" onclick="jump(' + i + ')">' + (i + 1) + '</button>';
  });
  main.innerHTML = `
    <div class="exam-topbar">
      <div>Question ${idx + 1} of ${QUESTIONS.length}</div>
      <a class="btn-ghost" href="secplus.html">Exit</a>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-card">
      <div class="q-text">${q.q}</div>
      ${opts}
      <div class="nav-row">
        <button class="btn-ghost" onclick="prev()">Previous</button>
        <button class="btn-lime" onclick="next()">${idx === QUESTIONS.length - 1 ? 'Finish' : 'Next'}</button>
      </div>
    </div>
    <div class="jump-wrap">
      <div class="jump-label">JUMP TO QUESTION</div>
      <div class="jump-grid">${jumps}</div>
    </div>`;
}
function pick(i) {
  if (locked[idx] && mode === 'instant') return;
  answers[idx] = i;
  if (mode === 'instant') {
    locked[idx] = true;
    const q = QUESTIONS[idx];
    const ok = i === q.correct;
    document.getElementById('fb-title').textContent = ok ? 'Correct' : 'Not quite';
    document.getElementById('fb-body').textContent = q.exp || '';
    document.getElementById('feedback-modal').classList.add('open');
  }
  render();
}
function closeFb() { document.getElementById('feedback-modal').classList.remove('open'); }
function jump(i) { idx = i; render(); }
function prev() { if (idx > 0) { idx--; render(); } }
function next() {
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
  else finish();
}
function finish() {
  let c = 0;
  QUESTIONS.forEach((q, i) => { if (answers[i] === q.correct) c++; });
  const pct = Math.round(c / QUESTIONS.length * 100);
  document.getElementById('exam-main').innerHTML = `
    <div class="q-card" style="text-align:center;padding:2rem;">
      <div style="font-family:'Archivo Black',sans-serif;font-size:1.6rem;">${c} / ${QUESTIONS.length}</div>
      <p style="color:var(--text-secondary);">${pct}%</p>
      <a class="btn-lime" href="secplus.html" style="display:inline-block;margin-top:1rem;text-decoration:none;">Back to Hub</a>
    </div>`;
}
